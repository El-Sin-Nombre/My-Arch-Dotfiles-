
# 🔤 Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11

# 💎 Background & Foreground
# No explicit background color: preserve terminal transparency
# Background & Foreground
background       #161616
foreground       #F1F8FF

# 🔷 Cursor
cursor           #42C8FF
cursor_text_color #071426

# 🌫️ Transparency
# Frosted glass
background_opacity 0.65

# 🩵 Selection
selection_background #167BFF
selection_foreground #FFFFFF

# ✨ Borders
active_border_color   #42C8FF
inactive_border_color #254568
bell_border_color     #FF8FE5

# 🎨 Color Palette — Electric Blue + Ice White

# Normal colors
color0  #101B2D
color1  #FF6B9A
color2  #62E6B8
color3  #FFD580
color4  #278DFF
color5  #C6A0FF
color6  #42DFFF
color7  #D8E9FF

# Bright colors
color8  #425777
color9  #FF8FB5
color10 #91FFD6
color11 #FFE6A6
color12 #69B5FF
color13 #DFBEFF
color14 #83F0FF
color15 #FFFFFF

# 🧼 Window Padding
window_padding_width 10

# ✨ Smooth Scrolling
scrollback_lines 10000

# 🚫 Disable Bell
enable_audio_bell no

# 🌊 Cursor Trail
cursor_trail 1

# 🛠️ Remote Control
allow_remote_control yes

